name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --locked
      - name: Lint
        run: |
          uvx ruff@0.16.0 check .
          uvx ruff@0.16.0 format --check .
      - name: Test
        run: uv run pytest
      - name: Build all seven fonts
        run: |
          uv run python scripts/make_font.py
          uv run python scripts/make_font_serif.py
          uv run python scripts/make_font_script.py
          uv run python scripts/make_font_hand.py
          uv run python scripts/make_font_moderne.py
          uv run python scripts/make_font_blackletter.py
          uv run python scripts/make_font_marquee.py
