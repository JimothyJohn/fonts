[project]
name = "font"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.65.0",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fontgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
